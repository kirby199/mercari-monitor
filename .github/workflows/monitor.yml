name: Mercari monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: mercari-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save seen listings
        if: success()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "mercari-monitor"
            git config user.email "mercari-monitor@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings"
            git pull --rebase
            git push
          fi
